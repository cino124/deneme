
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenerbahçe Taraftar Yarışması</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#071d42,#164477);
 color:white;font-family:Arial,sans-serif
}
.container{
 width:100%;max-width:680px;padding:25px;
 background:#102c50;border:2px solid #ffdf00;
 border-radius:18px;box-shadow:0 10px 35px #0008
}
h1{text-align:center;color:#ffdf00}
.subtitle{text-align:center;color:#ddd}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.info span{background:#071d42;padding:10px;border-radius:8px}
#question{font-size:21px;line-height:1.5;margin:25px 0}
.answers{display:grid;gap:12px}
.answer{
 background:#193e68;border:1px solid #6684a5;
 color:white;padding:15px;border-radius:10px;
 text-align:left;font-size:16px;cursor:pointer
}
.answer:hover:not(:disabled){background:#285888}
.answer:disabled{cursor:default;opacity:1}
.correct{background:#176b38!important}
.wrong{background:#8c2525!important}
.main{
 background:#ffdf00;color:#071d42;border:0;
 padding:13px 20px;border-radius:9px;
 font-weight:bold;cursor:pointer;font-size:15px
}
.main:disabled{opacity:.5;cursor:default}
.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
#message{text-align:center;min-height:25px;margin-top:15px;font-weight:bold}
#progress{height:9px;background:#071d42;border-radius:10px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#ffdf00;transition:.3s}
#result{text-align:center;display:none}
input{padding:12px;border-radius:8px;border:0;width:100%;margin:10px 0}
#leaderboard{text-align:left;background:#071d42;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>FENERBAHÇE</h1>
<p class="subtitle">Gerçek Taraftar Bilgi Yarışması</p>

<div id="game">
<div class="info">
<span id="number">Soru: 1/15</span>
<span id="score">Puan: 0</span>
<span id="timer">Süre: 15:00</span>
</div>

<div id="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<div id="message"></div>

<div class="bottom">
<button class="main" id="hint">İpucu kullan</button>
<button class="main" id="next" disabled>Sonraki soru</button>
</div>
</div>

<div id="result">
<h2>YARIŞMA TAMAMLANDI!</h2>
<h1 id="finalScore"></h1>
<p id="finalText"></p>
<input id="playerName" maxlength="18" placeholder="Adını yaz">
<button class="main" onclick="saveScore()">Skoru kaydet</button>
<h3>En iyi 10 taraftar</h3>
<div id="leaderboard"></div>
<br>
<button class="main" onclick="location.reload()">Tekrar oyna</button>
</div>
</div>

<script>
const questions=[

{
q:"Fenerbahçe Spor Kulübü hangi yıl kurulmuştur?",
a:["1903","1905","1907","1911"],
c:2,
h:"Kulübün kuruluş yılı, armasında da sıkça karşına çıkar."
},

{
q:"Fenerbahçe'nin kurucularından ve ilk başkanı kimdir?",
a:["Şükrü Saracoğlu","Ziya Songülen","Lefter Küçükandonyadis","Faruk Ilgaz"],
c:1,
h:"Nurizade unvanıyla da bilinir."
},

{
q:"Lefter Küçükandonyadis'in meşhur lakabı nedir?",
a:["Sinyor","Ordinaryüs","Kral","Profesör"],
c:1,
h:"Futbol bilgisini ve ustalığını anlatan bir unvan."
},

{
q:"Alex de Souza hangi ülkenin futbolcusudur?",
a:["Arjantin","Brezilya","Portekiz","İspanya"],
c:1,
h:"Sarı-lacivertli taraftarların çok sevdiği Güney Amerikalı futbolcu."
},

{
q:"Alex de Souza, Fenerbahçe'de hangi forma numarasıyla özdeşleşmiştir?",
a:["7","9","10","11"],
c:2,
h:"Oyun kurucuların sıkça tercih ettiği numara."
},

{
q:"Can Bartu'nun unutulmaz lakabı nedir?",
a:["Ordinaryüs","Sinyor","Kaptan","Panter"],
c:1,
h:"İtalyanca kökenli bir hitap şekli."
},

{
q:"Fenerbahçe, 6 Kasım 2002'de Galatasaray'ı kaç kaç yenmiştir?",
a:["4-0","5-1","6-0","7-2"],
c:2,
h:"Tarihe geçen farklı bir Kadıköy galibiyeti."
},

{
q:"Fenerbahçe, 2007-2008 Şampiyonlar Ligi son 16 turunda hangi takımı penaltılarla elemiştir?",
a:["Chelsea","Sevilla","Roma","Liverpool"],
c:1,
h:"İspanya temsilcisi."
},

{
q:"Fenerbahçe, 2007-2008 Şampiyonlar Ligi çeyrek finalinde hangi takımla eşleşmiştir?",
a:["Barcelona","Manchester United","Chelsea","Arsenal"],
c:2,
h:"Londra merkezli İngiliz kulübü."
},

{
q:"Fenerbahçe, 2012-2013 Avrupa Ligi yarı finalinde hangi takımla karşılaşmıştır?",
a:["Benfica","Ajax","Chelsea","Tottenham"],
c:0,
h:"Portekiz temsilcisi."
},

{
q:"Fenerbahçe'nin 1996 yılında Old Trafford'da Manchester United'ı 1-0 yendiği maçın golünü kim atmıştır?",
a:["Alex de Souza","Elvir Bolić","Tuncay Şanlı","Ariel Ortega"],
c:1,
h:"Bosna-Hersekli golcü."
},

{
q:"Fenerbahçe'nin 2010-2011 sezonundaki teknik direktörü kimdi?",
a:["Christoph Daum","Aykut Kocaman","Ersun Yanal","İsmail Kartal"],
c:1,
h:"Futbolculuk döneminde de Fenerbahçe forması giymiştir."
},

{
q:"Fenerbahçe'nin 2013-2014 sezonunda Süper Lig şampiyonu olduğu dönemde teknik direktörü kimdi?",
a:["Aykut Kocaman","Vítor Pereira","Ersun Yanal","İsmail Kartal"],
c:2,
h:"Sarı-lacivertli takımı şampiyonluğa taşıyan teknik adam."
},

{
q:"Fenerbahçe'nin 2007-2008 Şampiyonlar Ligi grup aşamasında Inter'i 1-0 yendiği maçta golü kim atmıştır?",
a:["Deivid","Alex","Semih Şentürk","Tuncay Şanlı"],
c:0,
h:"Brezilyalı futbolcu. Chelsea maçında da gol atmıştı."
},

{
q:"Fenerbahçe'nin 2012-2013 Avrupa Ligi yarı finalindeki rakibi Benfica'ya karşı ilk maçta galibiyet golünü kim atmıştır?",
a:["Dirk Kuyt","Egemen Korkmaz","Moussa Sow","Pierre Webó"],
c:1,
h:"Türk savunma oyuncusu."
}

];

let index=0;
let score=0;
let time=900;
let answered=false;
let hintUsed=false;
let timerInterval;

const $=id=>document.getElementById(id);

function sound(freq,duration){
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value=freq;
  gain.gain.value=.08;
  osc.start();
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

function showQuestion(){
 answered=false;
 hintUsed=false;
 $("message").textContent="";
 $("next").disabled=true;
 $("hint").disabled=false;

 $("number").textContent=`Soru: ${index+1}/${questions.length}`;
 $("score").textContent="Puan: "+score;
 $("bar").style.width=(index/questions.length*100)+"%";

 $("question").textContent=questions[index].q;
 $("answers").innerHTML="";

 questions[index].a.forEach((answer,i)=>{
  const btn=document.createElement("button");
  btn.className="answer";
  btn.textContent=String.fromCharCode(65+i)+") "+answer;
  btn.onclick=()=>chooseAnswer(i);
  $("answers").appendChild(btn);
 });
}

function chooseAnswer(choice){
 if(answered)return;
 answered=true;

 const q=questions[index];
 const buttons=document.querySelectorAll(".answer");

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.c)b.classList.add("correct");
  if(i===choice&&choice!==q.c)b.classList.add("wrong");
 });

 if(choice===q.c){
  const earned=hintUsed?5:10;
  score+=earned;
  $("message").textContent="Doğru cevap! +"+earned+" puan";
  sound(750,.2);
 }else{
  $("message").textContent="Yanlış cevap! Doğru cevap: "+q.a[q.c];
  sound(180,.3);
 }

 $("score").textContent="Puan: "+score;
 $("next").disabled=false;
 $("hint").disabled=true;
}

$("hint").onclick=()=>{
 if(answered||hintUsed)return;
 hintUsed=true;
 $("message").textContent="İpucu: "+questions[index].h;
 $("hint").disabled=true;
};

$("next").onclick=()=>{
 index++;
 if(index>=questions.length){
  endGame();
 }else{
  showQuestion();
 }
};

function endGame(){
 clearInterval(timerInterval);
 $("game").style.display="none";
 $("result").style.display="block";
 $("finalScore").textContent=score+" PUAN";

 $("finalText").textContent=
 score>=130?"Mükemmel! Fenerbahçe tarihine hakimsin!":
 score>=100?"Harika! Gerçek bir Fenerbahçe taraftarısın!":
 score>=70?"Güzel sonuç! Daha da iyisini yapabilirsin.":
 "Biraz daha Fenerbahçe tarihi çalışmalısın!";

 showScores();
}

function saveScore(){
 const name=$("playerName").value.trim()||"İsimsiz";
 let list=JSON.parse(localStorage.getItem("fbTaraftarScores")||"[]");

 list.push({name,score});
 list.sort((a,b)=>b.score-a.score);

 localStorage.setItem("fbTaraftarScores",JSON.stringify(list.slice(0,10)));

 $("playerName").disabled=true;
 showScores();
}

function showScores(){
 let list=JSON.parse(localStorage.getItem("fbTaraftarScores")||"[]");

 $("leaderboard").innerHTML=list.length?
 list.map((x,i)=>
 `<p>${i+1}. ${escapeHTML(x.name)} — ${x.score} puan</p>`
 ).join("")
 :"Henüz kayıt yok.";
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 }[c]));
}

function updateTimer(){
 time--;
 const m=Math.floor(time/60);
 const s=time%60;

 $("timer").textContent=
 `Süre: ${m}:${String(s).padStart(2,"0")}`;

 if(time<=0)endGame();
}

showQuestion();
timerInterval=setInterval(updateTimer,1000);
</script>
</body>
</html>
